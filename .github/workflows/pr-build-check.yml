name: PR Build Check

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_VOC_ENDPOINT: ${{ vars.VITE_VOC_ENDPOINT }}
        run: pnpm run build:local

      - name: Test stateless template sharing
        run: pnpm run test:template-share

      - name: Build GitHub Pages share viewer
        run: pnpm run build:gh-pages

      - name: Test and build Cloudflare Worker
        run: |
          pnpm run test:worker
          pnpm run build:worker

      - name: Build success
        run: echo "✅ Build completed successfully!"
