name: PR Build Check

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Build project
        env:
          VITE_VOC_ENDPOINT: ${{ vars.VITE_VOC_ENDPOINT }}
        run: pnpm run build:local

      - name: Test local-first and monitoring contracts
        run: |
          pnpm run test:monitoring
          pnpm run test:sentry-bundle
          pnpm run test:templates
